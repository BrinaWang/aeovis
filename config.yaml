evaluation:
  competitors:
  - Fivetran
  - Oracle GoldenGate
  - Qlik Replicate
  - Confluent
  - AWS DMS
  - Estuary
  crawlers:
  - OAI-SearchBot
  - PerplexityBot
  - Claude-SearchBot
  - ClaudeBot
  - Googlebot
  - Bingbot
  - GPTBot
  - ChatGPT-User
  - Perplexity-User
  important_striim_pages:
  - https://www.striim.com/product/
  - https://www.striim.com/solutions/
  - https://www.striim.com/docs/
  - https://www.striim.com/customers/
general:
  cost_limit_per_day: 7.0
  cost_limit_per_run: 5.0
  log_level: INFO
  output_db_path: data/eval_runs.db
  question_json_path: question.json
providers:
  claude:
    # Claude Sonnet 5: $2/M input, $10/M output
    cost_per_1k_input_tokens: 0.002
    cost_per_1k_output_tokens: 0.01
    max_tokens: 8000
    model_name: claude-sonnet-5
    rate_limit_rpm: 100
    rate_limit_tpm: 150000
    timeout_seconds: 300
  gemini:
    cost_per_1k_input_tokens: 0.075
    cost_per_1k_output_tokens: 0.3
    model_name: gemini-2.0-flash
    rate_limit_rpm: 1000
    rate_limit_tpm: 1000000
    timeout_seconds: 60
  grok:
    cost_per_1k_input_tokens: 0.002
    cost_per_1k_output_tokens: 0.01
    model_name: grok-2
    rate_limit_rpm: 100
    rate_limit_tpm: 200000
    timeout_seconds: 60
  openai:
    cost_per_1k_input_tokens: 0.015
    cost_per_1k_output_tokens: 0.06
    model_name: gpt-4o
    rate_limit_rpm: 500
    rate_limit_tpm: 200000
    timeout_seconds: 60
  perplexity:
    cost_per_1k_input_tokens: 0.003
    cost_per_1k_output_tokens: 0.015
    model_name: sonar-pro
    rate_limit_rpm: 100
    rate_limit_tpm: 150000
    timeout_seconds: 60
retry_policy:
  backoff_factor: 2.0
  initial_delay_ms: 100
  max_delay_ms: 30000
  max_retries: 3
scheduling:
  default_schedule: 0 9 * * MON
  timezone: US/Eastern
