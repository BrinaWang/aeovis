[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aeo-eval"
version = "0.1.0"
description = "Answer Engine Evaluation Runner"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "anthropic>=0.122.0",
    "openai>=2.48.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "apscheduler>=3.10.0",
    "httpx>=0.25.0",
    "beautifulsoup4>=4.12.0",
    "streamlit>=1.28.0",
    "plotly>=5.17.0",
    "pandas>=2.0.0",
    "trafilatura>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23.0",
    "freezegun>=1.5.0",
    "pytest-mock>=3.12.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["aeo_eval"]
